; mxv2 スキン - Default
;
; 旧 mxv (640x480) のレイアウトをそのまま書き出したもの。
; 値の意味は src/skin.h を参照。座標は画面左上を原点とした論理ピクセル。
; ここに書かなかった項目は src/skin.cpp の既定値（＝この内容と同じ）になる。
;
; Img で始まるキーは素材のファイル名。スキンのフォルダに無いファイルは
; Base のフォルダから読まれる。

[Screen]
Width=640
Height=480
ImgBack=back.bmp

; 鍵盤。XOffset は 1 オクターブ分の鍵の x で、13 個目はオクターブの幅。
; ChannelY は FM 8ch + PCM 行の y。
; ImgKeyboard0 は下地、1 は白鍵側の鍵、2 は黒鍵側の鍵。
[Keyboard]
Pos=4,4
XOffset=0,3,6,9,12,18,21,24,27,30,33,36,42
YOffset=0
ChannelY=0,38,76,114,152,190,228,266,304
KeyOffset=3
ImgKeyboard0=kb0.bmp
ImgKeyboard1=kb1.bmp
ImgKeyboard2=kb2.bmp

; ステータス欄などに使うミニフォント（ビットマップ文字）。
; 素材は ASCII 0x20〜0x6F を 16 列 x 5 行に並べたグリフ表で、
; **1 文字の大きさは素材の大きさ ÷ この並びで決まる**
; （minifont.bmp は 80x35 なので 5x7。大きい素材にすれば大きい字になる）。
; Width/Height は画面に置くときの送り幅と行の高さで、字間・行間を含む。
[MiniFont]
Width=6
Height=8
ImgMiniFont=minifont.bmp

; チャンネルごとのステータス欄。PcmX/PcmY は PCM 8ch の並び。
;
; Pos で始まるキーは 1 段（1 チャンネル）の中での各項目の位置 (x,y) で、
; Pos と [Keyboard] ChannelY が足される。FM の 8 段はこの並びをそのまま
; 繰り返す。PosPcmVolume / PosPcmPtr だけは PCM 行の中の話で、
; PcmX/PcmY のスロットからの相対になる。
; 文字はミニフォント（1 文字ぶんの送りは [MiniFont] Width）で、
; 各項目の桁数は次のとおり:
;   Volume "V127" 4桁 / LevelMeter 素材の幅 / Panpot "-LRC" 1桁
;   Detune "D+0000" 6桁 / Voice "@000" 4桁 / Q "Q000" 4桁 / Ptr "$00000" 6桁
;   LFOPitch  "P+0000" 6桁 / 1 波形 1桁 / 2 "0000" 4桁 / 3 "+0000" 5桁 / 4 "D000" 4桁
;   LFOVolume "A+0000" 6桁 / 1 波形 1桁 / 2 "0000" 4桁 / 3 "+0000" 5桁
;   PcmVolume "V127" 4桁 / PcmPtr "$00000" 6桁
[Status]
Pos=344,4
BackWidth=128
BackHeight=35
PcmX=0,0,0,0,68,68,68,68
PcmY=0,9,18,27,0,9,18,27
PosVolume=2,0
PosLevelMeter=26,0
PosPanpot=122,0
PosDetune=2,9
PosVoice=40,9
PosQ=66,9
PosPtr=92,9
PosLFOPitch=2,18
PosLFOPitch1=40,18
PosLFOPitch2=46,18
PosLFOPitch3=72,18
PosLFOPitch4=104,18
PosLFOVolume=2,27
PosLFOVolume1=40,27
PosLFOVolume2=46,27
PosLFOVolume3=72,27
PosPcmVolume=2,0
PosPcmPtr=24,0

; SrcX は素材の左端を何画素捨てるかで、描く幅は「素材の幅 - SrcX」。
; 素材は 1 段ぶんの幅で作ってあり、音量表示と重なる左端を切って使う。
[LevelMeter]
PaletteOffset=32
Cells=64
SrcX=32
ImgLevelMeter=levelmeter.bmp

[Banner]
Rect=476,4,160,54
ImgBanner=banner.bmp

[Title]
Rect=4,348,632,14

; Rect 以外はどれも「小さい文字, 大きい文字」の 2 つ組。1 つだけ書けば
; 両方に効く。BaseNameX 以下は行の左端からのピクセル位置と、
; そこに描ける幅（ピクセル）。プロポーショナルフォントでも意味を持つように、
; 旧 mxv の「文字数」ではなくピクセルで指定する。
[FileList]
Rect=4,366,620,110
Rows=11,8
ItemHeight=10,13
BaseNameX=5,6
BaseNameWidth=120,156
TitleX=125,162
TitleWidth=480,624

; 部品は 6 つ。Src* は ImgScrollBar の中の位置と大きさ、Pos* は Rect の左上
; からの配置（[PlayKey] の Src<n> / Pos<n> と同じ書き方）。
; つまみ (Thumb) は溝 (Bar) の中を動くので位置が計算で決まり、押下中の矢印
; (UpArrowPress / DownArrowPress) は通常の矢印と同じ場所に描かれるので、
; この 3 つに Pos は要らない。
; つまみが動ける幅は「Bar の高さ - Thumb の高さ」になる。
[ScrollBar]
Rect=624,366,12,110
SrcThumb=0,0,12,12
SrcUpArrowPress=0,12,12,12
SrcDownArrowPress=0,24,12,12
SrcUpArrow=0,36,12,12
SrcBar=0,48,12,86
SrcDownArrow=0,134,12,12
PosUpArrow=0,0
PosBar=0,12
PosDownArrow=0,98
ImgScrollBar=scrollbar.bmp

; 素材は上段が未再生、下段が再生済み。
[ProgressBar]
Rect=476,270,160,6
TimeX=16
TimeY=8
ImgProgressBar=progressbar.bmp

; NobSrc / SlideSrc は ImgVolumeBar の中の位置。
[VolumeBar]
Rect=476,300,64,16
TimeX=64
TimeY=6
NobWidth=8
NobSrc=0,0,8,16
SlideSrc=8,0,64,16
ImgVolumeBar=volbar.bmp

; Src<n> は ImgPlayKey の中の位置、Pos<n> は画面上の配置 (Pos からの相対)。
; 並びは PREV STOP PLAY FASTPLAY PAUSE NEXT CONT REPEAT SHUFFLE。
; Count=8 だと SHUFFLE は使わない（旧 mxv と同じ）。
[PlayKey]
Pos=476,300
Count=8
Src0=0,0,24,24
Src1=24,0,24,24
Src2=48,0,33,24
Src3=81,0,15,24
Src4=96,0,24,24
Src5=120,0,24,24
Src6=144,0,32,13
Src7=176,0,32,13
Src8=208,0,40,13
Pos0=0,20
Pos1=28,20
Pos2=56,20
Pos3=89,20
Pos4=108,20
Pos5=136,20
Pos6=93,0
Pos7=128,0
Pos8=76,0
PalKey=6
PalPlayLed=7
PalPauseLed=8
PalContLed=9
PalRepeatLed=10
PalDark=2
PalRed=16
PalGreen=17
ImgPlayKey=playkey.bmp
