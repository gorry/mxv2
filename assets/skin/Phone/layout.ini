; mxv2 スキン - Phone
;
; 縦長（480x720）用レイアウト

[Screen]
Width=480
Height=720

; 鍵盤。XOffset は 1 オクターブ分の鍵の x で、13 個目はオクターブの幅。
; ChannelY は FM 8ch + PCM 行の y。
[Keyboard]
Pos=4,4
XOffset=0,3,6,9,12,18,21,24,27,30,33,36,42
YOffset=0
ChannelY=0,38,76,114,152,190,228,266,304
KeyOffset=3

; ビジュアライザで使う 5x7 フォントのセルの大きさ (font5x7.bmp)
[Font5x7]
Width=6
Height=8

; チャンネルごとのステータス欄。PcmX/PcmY は PCM 8ch の並び。
[Status]
Pos=344,4
BackWidth=128
BackHeight=35
PcmX=0,0,0,0,68,68,68,68
PcmY=0,9,18,27,0,9,18,27

[LevelMeter]
PaletteOffset=32
Cells=64

[Banner]
Rect=4,348,160,54

[Title]
Rect=4,424,472,24

; Rect 以外はどれも「小さい文字, 大きい文字」の 2 つ組。1 つだけ書けば
; 両方に効く。BaseNameX 以下は行の左端からのピクセル位置と、
; そこに描ける幅（ピクセル）。プロポーショナルフォントでも意味を持つように、
; 旧 mxv の「文字数」ではなくピクセルで指定する。
[FileList]
Rect=4,452,472,250
Rows=15,10
ItemHeight=16,24
BaseNameX=8,12
BaseNameWidth=144,156
TitleX=144,156
TitleWidth=320,308

[ScrollBar]
Rect=464,452,12,250
ButtonHeight=12

[ProgressBar]
Rect=4,406,160,6
TimeX=16
TimeY=8

; NobSrc / SlideSrc は volbar.bmp の中の位置。
[VolumeBar]
Rect=168,348,64,16
TimeX=64
TimeY=6
NobWidth=8
NobSrc=0,0,8,16
SlideSrc=8,0,64,16

; Src<n> は playkey.bmp の中の位置、Pos<n> は画面上の配置 (Pos からの相対)。
; 並びは PREV STOP PLAY FASTPLAY PAUSE NEXT CONT REPEAT SHUFFLE。
; Count=8 だと SHUFFLE は使わない（旧 mxv と同じ）。
[PlayKey]
Pos=168,348
Count=8
Src0=0,0,24,24
Src1=24,0,24,24
Src2=48,0,33,24
Src3=81,0,15,24
Src4=96,0,24,24
Src5=120,0,24,24
Src6=144,0,32,13
Src7=176,0,32,13
Src8=208,0,40,13
Pos0=0,20
Pos1=28,20
Pos2=56,20
Pos3=89,20
Pos4=108,20
Pos5=136,20
Pos6=93,0
Pos7=128,0
Pos8=76,0
PalKey=6
PalPlayLed=7
PalPauseLed=8
PalContLed=9
PalRepeatLed=10
PalDark=2
PalRed=16
PalGreen=17

; 素材のファイル名。ここに無いものは既定値 (下と同じ) が使われる。
; スキンのフォルダに無いファイルは Base のフォルダから読まれる。
[Assets]
Back=back.bmp
Keyboard0=kb0.bmp
Keyboard1=kb1.bmp
Keyboard2=kb2.bmp
Font5x7=font5x7.bmp
LevelMeter=levelmeter.bmp
Banner=banner.bmp
PlayKey=playkey.bmp
ProgressBar=progressbar.bmp
VolumeBar=volbar.bmp
ScrollBar=scrollbar.bmp
