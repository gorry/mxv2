; mxv2 スキン - Phone
;
; 縦長（480x720）用レイアウト
;
; Img で始まるキーは素材のファイル名。スキンのフォルダに無いファイルは
; Base のフォルダから読まれる。

; Width/Height は「宣言サイズ」。窓の縦横比がこれと違うときは、
; FilerSide で指定した側だけが伸び縮みして窓に寄る（fullscreen.md）。
; FilerExtent はファイラー側の矩形の厚みで、720-462=258。
;
; ImgBack は宣言サイズより大きくてよく、伸ばせる上限はその絵の高さになる。
; back.bmp は 480x1024 で描いてあるので、縦は 1024 まで伸びる
; （縦長の端末なら、たいていレターボックスは出ない）。
[Screen]
Width=480
Height=720
FilerSide=Bottom
FilerExtent=258
ImgBack=back.bmp

; 鍵盤。XOffset は 1 オクターブ分の鍵の x で、13 個目はオクターブの幅。
; ChannelY は FM 8ch + PCM 行の y。
; ImgKeyboard0 は下地、1 は白鍵側の鍵、2 は黒鍵側の鍵。
[Keyboard]
Pos=4,4
XOffset=0,3,6,9,12,18,21,24,27,30,33,36,42
YOffset=0
ChannelY=0,38,76,114,152,190,228,266,304
KeyOffset=3
ImgKeyboard0=kb0.bmp
ImgKeyboard1=kb1.bmp
ImgKeyboard2=kb2.bmp

; ステータス欄などに使うミニフォント（ビットマップ文字）。
; 1 文字の大きさは素材（16 列 x 5 行のグリフ表）の大きさで決まり、
; Width/Height は画面に置くときの送り幅と行の高さ。詳しくは
; Default の layout.ini を参照。
[MiniFont]
Width=6
Height=8
ImgMiniFont=minifont.bmp

; チャンネルごとのステータス欄。PcmX/PcmY は PCM 8ch の並び。
; Rect の x,y は 9 段全体の左上、w,h は 1 段ぶんの背景の大きさ。
; Pos で始まるキーは 1 段の中での各項目の位置 (x,y)。詳しくは
; Default の layout.ini を参照。
[Status]
Rect=345,4,128,35
PcmX=0,0,0,0,68,68,68,68
PcmY=0,9,18,27,0,9,18,27
PosVolume=2,0
PosLevelMeter=26,0
PosPanpot=122,0
PosDetune=2,9
PosVoice=40,9
PosQ=66,9
PosPtr=92,9
PosLFOPitch=2,18
PosLFOPitch1=40,18
PosLFOPitch2=46,18
PosLFOPitch3=72,18
PosLFOPitch4=104,18
PosLFOVolume=2,27
PosLFOVolume1=40,27
PosLFOVolume2=46,27
PosLFOVolume3=72,27
PosPcmVolume=2,0
PosPcmPtr=24,0
OPMOperatorY=0,18,9,27
PosOPMAlgorythm=0,0
PosOPMFeedback=0,9
PosOPMAttackRate=14,0
PosOPMDecayRate=28,0
PosOPMSustainRate=42,0
PosOPMReleaseRate=56,0
PosOPMSustainLevel=64,0
PosOPMTotalLevel=72,0
PosOPMKeyScaling=86,0
PosOPMMultiple=96,0
PosOPMDetune1=106,0
PosOPMDetune2=114,0
PosOPMAMSEnable=122,0
PosOPMNoise=0,9
PosOPMClockB=0,18
PosOPMLFOFreq=0,27
PosOPMLFOPMD=68,9
PosOPMLFOAMD=68,18
PosOPMLFOWAVE=68,27

; OPM レジスタ一覧のオーバーレイ（regmap.md）。鍵盤の長押しで出す。
; Rect は矩形、Pos は矩形の左上からの文字の描き始め。詳しくは Default を参照。
[RegMap]
Rect=3,61,340,230
Pos=3,3

; SrcX は素材の左端を何画素捨てるか（描く幅は「素材の幅 - SrcX」）。
[LevelMeter]
PaletteOffset=32
Cells=64
SrcX=32
ImgLevelMeter=levelmeter.bmp

[Banner]
Rect=4,348,160,54
ImgBanner=banner.bmp

[Title]
Rect=4,434,472,24
ScrollSpeed=100

; Margin は「ファイラー側の矩形」(0,462,480,258) から内側へ寄せる量
; (左,上,右,下)。残った (4,462,472,250) を一覧とスクロールバーで分け合う。
;
; Margin 以外はどれも「小さい文字, 大きい文字」の 2 つ組。1 つだけ書けば
; 両方に効く。BaseNameX 以下は行の左端からのピクセル位置と、
; そこに描ける幅（ピクセル）。プロポーショナルフォントでも意味を持つように、
; 旧 mxv の「文字数」ではなくピクセルで指定する。
;
; 行数と曲名の幅は書かない（矩形と ItemHeight / TitleX から決まる）。
[FileList]
Margin=4,0,4,8
ItemHeight=16,24
BaseNameX=8,12
BaseNameWidth=112,156
TitleX=120,156
ScrollSpeed=150

; スクロールバーはファイラーの矩形の右端を分け合う。書くのは幅だけで、
; 位置は [FileList] Margin から決まる。
; ※ Phone 端末を考慮し、**描く幅より当たり判定を広く**取って、画面端での
;    指での操作をしやすくしている（HitWidth は一覧に 12px 食い込む）。
;
; Src* は ImgScrollBar の中の位置と大きさ。上矢印は上端、下矢印は下端に
; 貼り付き、溝 (Bar) は残りの高さぶん上から繰り返して敷かれる。
; つまみが動ける幅は「描いた溝の高さ - Thumb の高さ」になる。
; ※ 素材は幅 24 で作ってあり、左 12px は透明（旧レイアウトで当たり判定に
;    使っていた名残）。今は絵のある右 12px だけを Src* で指している。
[ScrollBar]
Width=12
HitWidth=24
SrcThumb=12,0,12,12
SrcUpArrowPress=12,36,12,12
SrcDownArrowPress=12,48,12,12
SrcUpArrow=12,12,12,12
SrcBar=12,60,12,226
SrcDownArrow=12,24,12,12
ImgScrollBar=scrollbar.bmp

; Src* は ImgProgressBar の中の位置と大きさ（上段 = 未再生。下段 = 再生済みは
; 同じ矩形をその高さぶん下へずらした位置）。バーは左端・中央・右端に分かれ、
; 左端は Rect の左端、右端は Rect の右端に貼り付き、中央 (SrcBar) は残りの
; 幅ぶん左から繰り返して敷かれる。素材の並びは左から 左端 / 右端 / 中央（残り全部）。
; TimePos は時刻表示の位置 (Rect の左上からの相対)。
[ProgressBar]
Rect=308,410,160,16
TimePos=16,10
ProgressPos=0,2
SrcBarLeft=0,0,12,6
SrcBarRight=12,0,12,6
SrcBar=24,0,136,6
ImgProgressBar=progressbar.bmp

; Src* は ImgVolumeBar の中の位置と大きさ。バーは左端・中央・右端に分かれ、
; 左端は Rect の左端、右端は Rect の右端に貼り付き、中央 (SrcBar) は残りの
; 幅ぶん左から繰り返して敷かれる。つまみは音量で Rect の中を左右に動く。
; 素材の並びは左から つまみ / 左端 / 右端 / 中央（残り全部）。
[VolumeBar]
Rect=8,406,128,26
VolumePos=128,8
SrcThumb=0,0,16,26
SrcBarLeft=16,0,16,26
SrcBarRight=32,0,16,26
SrcBar=48,0,96,26
ImgVolumeBar=volbar.bmp

; Src<n> は ImgPlayKey の中の位置、Pos<n> は画面上の配置 (Rect の左上からの
; 相対)。Rect の w,h は使うボタン全体を覆う大きさで、描画には使わない。
; 並びは PREV STOP PLAY FASTPLAY PAUSE NEXT CONT REPEAT SHUFFLE。
; Count=8 だと SHUFFLE は使わない（旧 mxv と同じ）。
[PlayKey]
Rect=169,348,304,82
Count=8
Src0=0,0,48,48
Src1=48,0,48,48
Src2=96,0,66,48
Src3=162,0,30,48
Src4=192,0,48,48
Src5=240,0,48,48
Src6=288,0,64,26
Src7=352,0,64,26
Src8=416,0,80,26
Pos0=0,0
Pos1=52,0
Pos2=104,0
Pos3=170,0
Pos4=204,0
Pos5=256,0
Pos6=0,56
Pos7=70,56
Pos8=152,56
PalKey=6
PalPlayLed=7
PalPauseLed=8
PalContLed=9
PalRepeatLed=10
PalDark=2
PalRed=16
PalGreen=17
PalYellow=18
PalBlue=19
ImgPlayKey=playkey.bmp
