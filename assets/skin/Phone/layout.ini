; mxv2 スキン - Phone
;
; 縦長（480x720）用レイアウト
;
; Img で始まるキーは素材のファイル名。スキンのフォルダに無いファイルは
; Base のフォルダから読まれる。

[Screen]
Width=480
Height=720
ImgBack=back.bmp

; 鍵盤。XOffset は 1 オクターブ分の鍵の x で、13 個目はオクターブの幅。
; ChannelY は FM 8ch + PCM 行の y。
; ImgKeyboard0 は下地、1 は白鍵側の鍵、2 は黒鍵側の鍵。
[Keyboard]
Pos=4,4
XOffset=0,3,6,9,12,18,21,24,27,30,33,36,42
YOffset=0
ChannelY=0,38,76,114,152,190,228,266,304
KeyOffset=3
ImgKeyboard0=kb0.bmp
ImgKeyboard1=kb1.bmp
ImgKeyboard2=kb2.bmp

; ステータス欄などに使うミニフォント（ビットマップ文字）。
; 1 文字の大きさは素材（16 列 x 5 行のグリフ表）の大きさで決まり、
; Width/Height は画面に置くときの送り幅と行の高さ。詳しくは
; Default の layout.ini を参照。
[MiniFont]
Width=6
Height=8
ImgMiniFont=minifont.bmp

; チャンネルごとのステータス欄。PcmX/PcmY は PCM 8ch の並び。
; Rect の x,y は 9 段全体の左上、w,h は 1 段ぶんの背景の大きさ。
; Pos で始まるキーは 1 段の中での各項目の位置 (x,y)。詳しくは
; Default の layout.ini を参照。
[Status]
Rect=344,4,128,35
PcmX=0,0,0,0,68,68,68,68
PcmY=0,9,18,27,0,9,18,27
PosVolume=2,0
PosLevelMeter=26,0
PosPanpot=122,0
PosDetune=2,9
PosVoice=40,9
PosQ=66,9
PosPtr=92,9
PosLFOPitch=2,18
PosLFOPitch1=40,18
PosLFOPitch2=46,18
PosLFOPitch3=72,18
PosLFOPitch4=104,18
PosLFOVolume=2,27
PosLFOVolume1=40,27
PosLFOVolume2=46,27
PosLFOVolume3=72,27
PosPcmVolume=2,0
PosPcmPtr=24,0

; SrcX は素材の左端を何画素捨てるか（描く幅は「素材の幅 - SrcX」）。
[LevelMeter]
PaletteOffset=32
Cells=64
SrcX=32
ImgLevelMeter=levelmeter.bmp

[Banner]
Rect=4,348,160,54
ImgBanner=banner.bmp

[Title]
Rect=4,434,472,24

; Rect 以外はどれも「小さい文字, 大きい文字」の 2 つ組。1 つだけ書けば
; 両方に効く。BaseNameX 以下は行の左端からのピクセル位置と、
; そこに描ける幅（ピクセル）。プロポーショナルフォントでも意味を持つように、
; 旧 mxv の「文字数」ではなくピクセルで指定する。
[FileList]
Rect=4,462,460,250
Rows=15,10
ItemHeight=16,24
BaseNameX=8,12
BaseNameWidth=112,156
TitleX=120,156
TitleWidth=340,308

; 部品は 6 つ。Src* は ImgScrollBar の中の位置と大きさ、Pos* は Rect の左上
; からの配置（[PlayKey] の Src<n> / Pos<n> と同じ書き方）。
; つまみ (Thumb) は溝 (Bar) の中を動くので位置が計算で決まり、押下中の矢印
; (UpArrowPress / DownArrowPress) は通常の矢印と同じ場所に描かれるので、
; この 3 つに Pos は要らない。
; つまみが動ける幅は「Bar の高さ - Thumb の高さ」になる。
; ※ Phone端末を考慮し、左側に透明の当たり判定を用意して、画面端での指での
;    操作をしやすくしている。
[ScrollBar]
Rect=452,462,24,250
SrcThumb=0,0,24,12
SrcUpArrowPress=0,36,24,12
SrcDownArrowPress=0,48,24,12
SrcUpArrow=0,12,24,12
SrcBar=0,60,24,226
SrcDownArrow=0,24,24,12
PosUpArrow=0,0
PosBar=0,12
PosDownArrow=0,238
ImgScrollBar=scrollbar.bmp

; 素材は上段が未再生、下段が再生済み。
[ProgressBar]
Rect=308,412,160,6
TimeX=16
TimeY=8
ImgProgressBar=progressbar.bmp

; NobSrc / SlideSrc は ImgVolumeBar の中の位置。
[VolumeBar]
Rect=8,406,128,26
TimeX=128
TimeY=8
NobWidth=16
NobSrc=128,0,16,26
SlideSrc=0,0,128,26
ImgVolumeBar=volbar.bmp

; Src<n> は ImgPlayKey の中の位置、Pos<n> は画面上の配置 (Rect の左上からの
; 相対)。Rect の w,h は使うボタン全体を覆う大きさで、描画には使わない。
; 並びは PREV STOP PLAY FASTPLAY PAUSE NEXT CONT REPEAT SHUFFLE。
; Count=8 だと SHUFFLE は使わない（旧 mxv と同じ）。
[PlayKey]
Rect=168,348,304,82
Count=8
Src0=0,0,48,48
Src1=48,0,48,48
Src2=96,0,66,48
Src3=162,0,30,48
Src4=192,0,48,48
Src5=240,0,48,48
Src6=288,0,64,26
Src7=352,0,64,26
Src8=416,0,80,26
Pos0=0,0
Pos1=52,0
Pos2=104,0
Pos3=170,0
Pos4=204,0
Pos5=256,0
Pos6=0,56
Pos7=70,56
Pos8=152,56
PalKey=6
PalPlayLed=7
PalPauseLed=8
PalContLed=9
PalRepeatLed=10
PalDark=2
PalRed=16
PalGreen=17
ImgPlayKey=playkey.bmp
