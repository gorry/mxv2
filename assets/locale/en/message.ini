; The left side is the command line syntax. Do not translate it.
[UsageOptions]
-zoom <percent>=Display scale % (100 is dot by dot; defaults to the system scale)
-loops <n>=Loops before the automatic fade out (default 2)
-nofade=Do not fade out automatically
-rate <hz>=Output sampling rate (44100 / 48000{0}; default {1})
-latency <ms>=Delay the display by ms (this run only; normally set in the settings)
-pdxpath <dir>=Extra folder to search for PDX
-assets <dir>=Where the bundled assets are (default: assets next to the executable)
-userdir <dir>=Where settings and user assets are (default: the OS user folder)
-locale <name>=Language of the messages (assets/locale/<name>/message.ini; default: ja-JP)
-skin <name>=Skin name (assets:<name> names the bundled one; default: Default)
-orient <0|1>=Switch skins by screen orientation (default: 1 on Android, 0 elsewhere)
-orientlock <0|1|2>=Force the orientation used to pick a skin (0=as seen 1=portrait 2=landscape; for debugging)
-folderfirst=List folders first in the file list
-quit=Close when playback ends (for debugging)
-console=Open a console for the log (not opened by default)

