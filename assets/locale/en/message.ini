; First-run tutorial (tutorial.md). Title<n> and Text<n> per step.
; Text<n>Desktop / Text<n>Mobile are notes added only on that platform, Try<n> is
; the "try it" paragraph, Try<n>Desktop / Try<n>Mobile the controls there.
; An ini value is one line, so paragraphs are separate keys.
[Tutorial]
; TitleFormat is the heading format: {0} heading, {1} step number, {2} number of steps.
TitleFormat=[{1}/{2}] {0}
Title1=Welcome to mxv2!
Text1=mxv2 plays X68000 music data (MDX files) and shows what is going on.\n\nThis tour takes about two minutes. [Quit] ends the tutorial.
Title2=The file list
Text2=The highlighted list is the file list. It shows folders and songs (MDX files).\nRight now it shows the bundled songs (Assets>).
Try2=Try it: open ArctanX.
Try2Desktop=Select it with the arrow keys and press the ENTER key, or double-click it.
Try2Mobile=Tap to select it, then swipe right (or double-tap).
Title3=Playing a song
Text3=Opening a song starts playback.
Try3=Try it: open any song.
Title4=Keyboards and status
Text4=The keyboards are the eight FM channels plus PCM at the bottom.\nThe panel on the right shows each channel's volume and voice.
Try4=Try it: press the keyboard of any row. That channel goes silent. Then press it again to bring every channel back.
Try4Desktop=The 1 to 8 keys do the same.
Title5=Playback buttons
Text5=These control playback. From the left: the previous, stop, play, fast forward, pause, and next buttons.
Try5=Try it: press the pause button, then press it again to resume.
Try5Desktop=The SPACE key does the same.
Title6=CONT / REPEAT and volume
Text6=With the CONT button on, the next song starts when one ends. The REPEAT button plays the same song again.\nThe volume bar sets the volume for this session; the progress bar moves the playback position.
Try6=Try it: press the CONT button to turn it on. If you leave it on, it is kept for the next start.
Try6Desktop=The C key does the same.
Title7=The menu
Text7=Press the logo to open the menu. Settings, colors, and the places your songs live are managed from here.
Text7Desktop=Right-click opens it too.
Try7=Try it: open the menu and choose [mxv2 Settings…] to open the [mxv2 Settings] dialog.
Title8=Settings
Text8=The look can be changed as a "skin". Language, text size, and more are in the [Settings] dialog.
Text8Desktop=The display scale is there too. From now on the F1 key opens it.
Text8Mobile=Turning the device sideways switches to the landscape skin.
Try8=Try it: when you are done looking, close the [Settings] dialog.
Try8Desktop=The ESC key closes it too.
Title9=Where the songs are
Text9=To play songs from any folder, first go back to the top level of the file list.
Text9After=This is the file system selection. Pick where your songs live here.
Text9AfterDesktop=Local> is this PC's drives and UserDir> is the user folder for mxv2.\nAdd folders you use often from [Setting] (opens [File system settings]).\n\nDragging and dropping an MDX file or a folder onto the window opens it too.
Text9AfterMobile=Add a folder on the device from [Setting] (opens [File system settings]). Added folders appear here as SAF>.
Try9=Try it: go to the parent folder until the list reads "Bookmarks> / Assets> / ...".
Try9Desktop=The BACKSPACE key goes up one level.
Try9Mobile=Swipe the file list to the left to go up one level.
Title10=Bookmarks
Text10=Folders you open often can be added to the bookmarks. In such a folder, choose [Add bookmark…] in the menu.\nOpen the added bookmarks from [Open bookmarks] in the menu.\nManage the bookmarks from [Bookmark settings…] in the menu.
Text10Desktop=The Shift+M key adds one, the M key opens the list, and the F4 key opens the settings.
Title11=That's all
Text11=Done. The full list of controls is always in [Other] > [Controls…] in the menu.\n\nTo see this tour again, turn on the [Show the tutorial at the next start] check box under [Behavior] in the [Settings] dialog.
Text11Desktop=The F11 and H keys open the controls too.
Start=Start
