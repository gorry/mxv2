; mxv2 message catalog (en)
;
; Machine translated from the Japanese catalog (locale/ja-JP/message.ini)
; by an AI. Wording has not been reviewed by a human translator.
;
; All text shown on screen and in the log lives here; the code only knows keys.
;
;   ・{0} {1} … are filled in at run time. Reorder them freely, but dropping one
;     drops that piece of information. Number formatting is done in the code.
;   ・Do not add "###" to the titles in [Dialog] (it separates the internal ID).
;   ・[HelpKeys] [HelpMouse] [UsageOptions] are "left=right" lists shown in the
;     order written here. **The left side is displayed too** - except in
;     [UsageOptions], where it is the actual command line syntax: do not
;     translate those.
;   ・Lines starting with ; or # are comments; both are fine inside a value.
;   ・Leading and trailing spaces of a value are dropped (separators that
;     matter are added by the code).
;
; Writing the same keys into locale/en/message.ini inside the user folder
; (%APPDATA%\mxv2\ on Windows) overrides the ones here. Only the keys you
; want to change are needed.

; The name of this language, written in the language itself. Shown in the
; [Language] list of the settings window.
