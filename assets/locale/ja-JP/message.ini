[UsageOptions]
-zoom <percent>=表示倍率 % (100 でドット等倍。既定はシステムの拡大率)
-loops <n>=自動フェードアウトまでのループ数 (既定 2)
-nofade=自動フェードアウトしない
-rate <hz>=出力サンプリングレート (44100 / 48000{0}。既定 {1})
-latency <ms>=表示を遅らせる時間 ms (この起動だけ。ふつうは設定で)
-pdxpath <dir>=PDX の追加探索先
-assets <dir>=同梱素材の場所 (既定: 実行ファイルの隣の assets)
-userdir <dir>=設定とユーザー素材の場所 (既定: OS のユーザーフォルダ)
-locale <name>=文言の言語 (assets/locale/<name>/message.ini。既定: ja-JP)
-skin <name>=スキン名 (assets:<name> で同梱ぶんを名指し。既定: Default)
-orient <0|1>=画面の向きでスキンを切り替える (既定: Android は 1、他は 0)
-orientlock <0|1|2>=スキンを選ぶ向きを固定 (0=見たまま 1=縦 2=横。デバッグ用)
-folderfirst=ファイラーでフォルダを先に並べる
-quit=演奏し終えたら終了する (デバッグ用)
-console=ログを出すコンソールを開く (既定は開かない)

