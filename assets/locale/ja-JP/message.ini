; mxv2 メッセージカタログ (ja-JP)
;
; 画面とログに出す文言はすべてここにある。コード側はキーで引くだけ。
;
;   ・{0} {1} … は実行時に埋まる。並べ替えは自由だが、消すとその情報が
;     出なくなる。数の書式（符号や小数点以下）はコード側で作っている。
;   ・[Dialog] の題名に "###" を足してはいけない（内部 ID の区切り）。
;   ・[HelpKeys] [HelpMouse] [UsageOptions] は「左=右」の一覧で、
;     書いてある順にそのまま出る。**左側も表示に使う**。
;   ・行頭の ; と # はコメント。値の途中には書ける。
;   ・値の前後の空白は落ちる（区切りの空白はコード側で足している）。
;
; ユーザーフォルダ（Windows なら %APPDATA%\mxv2\）の
; locale/ja-JP/message.ini に同じキーを書くと、そちらが優先される。
; 全部書く必要はなく、変えたいキーだけでよい。

; この言語自身での呼び名。設定ウィンドウの [言語] の一覧に出る。
[Locale]
Name=日本語

[Fs]
