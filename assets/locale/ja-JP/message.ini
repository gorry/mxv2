; 初回起動のチュートリアル (tutorial.md)。段ごとに Title<n> と Text<n>。
; Text<n>Desktop / Text<n>Mobile はその環境でだけ足す補足、Try<n> は
; 「やってみる」の段落、Try<n>Desktop / Try<n>Mobile はその環境での操作。
; 値の中の \n は改行になる（段落を分けたいときに使う）。
[Tutorial]
; TitleFormat は見出しの書式。{0} 見出し、{1} 段の番号、{2} 段の数。
TitleFormat=[{1}/{2}] {0}
Title1=mxv2 へようこそ！
Text1=X68000 の音楽データ (MDXファイル) を鳴らして、その様子を眺めるアプリです。\n\n使い方を 2 分ほどで案内します。「終了する」でチュートリアルを終了します。
Title2=ファイラー
Text2=明るくなっている一覧がファイラーです。フォルダと曲（MDXファイル）が並びます。\nいまは同梱の曲 (Assets>) を開いています。
Try2=やってみる: ArctanX を開いてください。
Try2Desktop=上下キーで選んで ENTER キー、またはダブルクリック。
Try2Mobile=タップして選び、右へはじく（またはダブルタップ）。
Title3=曲を鳴らす
Text3=曲の行を開くと演奏が始まります。
Try3=やってみる: 好きな曲を開いてください。
Title4=鍵盤とステータス
Text4=鍵盤は 8 つの FM 音源チャンネルと、一番下の PCM です。\n右の欄は各チャンネルの音量や音色の状態です。
Try4=やってみる: 好きな段の鍵盤を押してください。そのチャンネルだけ音が止まります。もう一度押して、もとに戻してください。
Try4Desktop=1〜8 キーでも同じです。
Title5=操作ボタン
Text5=演奏の操作です。左から 前の曲ボタン・停止ボタン・再生ボタン・早送りボタン・一時停止ボタン・次の曲ボタンです。
Try5=やってみる: 一時停止ボタンを押し、もう一度押して再開してください。
Try5Desktop=SPACE キーでも同じです。
Title6=CONT / REPEAT と音量
Text6=CONT ボタンを点けると、曲が終わったら次の曲へ進みます。REPEAT ボタンは同じ曲を繰り返します。\n音量バーは曲ごとの音量、プログレスバーで演奏位置を動かせます。
Try6=やってみる: CONT ボタンを押して、点けてください。点いたままにすると次回の起動にも残ります。
Try6Desktop=C キーでも同じです。
Title7=メニュー
Text7=ロゴを押すとメニューが出ます。設定や配色、曲の置き場所の管理はここからです。
Text7Desktop=右クリックでも出ます。
Try7=やってみる: メニューを開いて、[mxv2 の設定] ダイアログを開いてください。
Title8=設定
Text8=見た目は「スキン」として変更できます。言語、文字サイズなども含めて [mxv2 の設定] ダイアログにあります。
Text8Desktop=表示の大きさもここで変えられます。次からは F1 キーで開けます。
Text8Mobile=端末を横にすると横画面用のスキンに切り替わります。
Try8=やってみる: 見終えたら [mxv2 の設定] ダイアログを閉じてください。
Try8Desktop=ESC キーでも閉じられます。
Title9=曲の置き場所
Text9=好きなフォルダの曲を鳴らすには、まずファイラーを一番上の階層まで戻ります。
Text9After=ここが「ファイルシステムの選択」です。曲の置き場所はここから選びます。
Text9AfterDesktop=Local> がこの PC のドライブ、UserDir> が mxv2 用のユーザーフォルダです。\nよく使うフォルダは [Setting]（[ファイルシステムの設定]を開く） から追加できます。\n\nMDX ファイルやフォルダをウィンドウへ D&D しても開けます。
Text9AfterMobile=端末のフォルダは [Setting] （[ファイルシステムの設定]を開く）から追加できます。追加したフォルダは SAF> としてここに並びます。
Try9=やってみる: 親フォルダへ戻る操作を、一覧が「Bookmarks> / Assets> / …」になるまで繰り返してください。
Try9Desktop=BACKSPACE キーで階層を一つ戻ります。
Try9Mobile=ファイラーを左へはじくと階層を一つ戻ります。
Title10=ブックマーク
Text10=よく開くフォルダはブックマークに追加できます。追加したいフォルダでメニューの [ブックマークに追加…]を選びます。\n追加したブックマークは、メニューの「ブックマークを開く」から開きます。\nブックマークの管理は、メニューの [ブックマークの設定…] から行います。
Text10Desktop=Shift+M キーで追加、M キーで一覧、F4 キーで設定です。
Title11=おわり
Text11=以上です。操作の一覧はいつでもメニューの [その他] > [操作方法…] で見られます。\n\nもう一度見るには、[mxv2 の設定] ダイアログの [動作] で[次回起動時にチュートリアルを表示する]チェックを ON にしてください。
Text11Desktop=操作方法は F11 キー / H キーでも開けます。
Start=はじめる
Next=次へ
Skip=終了する
Close=閉じる
SkipQuestion=チュートリアルを終了しますか？\n（[mxv2 の設定] ダイアログの [動作] からもう一度見られます）
SkipYes=終了する
SkipNo=続ける
