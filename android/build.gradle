// Android Gradle Plugin 8.5.1 / Gradle 8.7 / JDK 21 で確認している。
buildscript {
	repositories {
		google()
		mavenCentral()
	}
	dependencies {
		classpath 'com.android.tools.build:gradle:8.5.1'
	}
}

allprojects {
	repositories {
		google()
		mavenCentral()
	}
}

tasks.register('clean', Delete) {
	delete rootProject.layout.buildDirectory
}
