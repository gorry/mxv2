org.gradle.jvmargs=-Xmx2048m

# AndroidX は使わない（SDL の Java と自前の Activity だけで、サポート
# ライブラリに依存していない）。
android.useAndroidX=false

# ビルドする ABI。**armeabi-v7a は 32bit の実機（AQUOS 603SH / Android 8.0）で
# 確認するために足した**（2026-09-07）。増やすと apk と CMake のビルド時間が
# そのぶん増える。x86_64（エミュレータ用）はまだ足していない。
#
# 32bit ビルドでは third_party/portable_mdx が
# 「4294967296 との比較は常に真」の警告を出す（uintptr_t が 32bit のため）。
# **third_party は無改変で置く方針**なので、そのままにしてある。
mxv2.abiFilters=arm64-v8a,armeabi-v7a
