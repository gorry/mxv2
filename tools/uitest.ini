; mxv2_uitest の最初の mxv2.ini（Makefile の test-ui が、使い捨ての -userdir へ写す）。
; 筋書き（tools/uitest.cpp の BuildScenario）が前提にしている状態を作る。
; [Bookmark] は書かない（初回の既定 "assets:" の 1 件をそのまま使う）。

[Tutorial]
; チュートリアルが出ると、キーを全部吸って操作待ちになる。
Done=1

[Network]
; 起動時の更新チェックで通信しない（結果のダイアログも出さない）。
UpdateCheck=0

[Play]
; 自動のままだと [画面の遅れ] の [設定…] が押せない（淡色）。
LatencyAuto=0

[Path]
; [PDX の探索先] の削除の確認を開くために 1 件要る。
PdxCount=1
Pdx1=assets:
