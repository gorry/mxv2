name: Release macOS (signed and notarized)

# 公証と Draft Release の作成は手動実行だけ。通常のビルドは build-macos.yml。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (example: macos-v2026.0929.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-notarized-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout selected commit and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test release failure handling
        run: python3 -B tools/test_macos_release.py

      - name: Check release tag and existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 tools/macos_draft_release.py --check-only --tag "$RELEASE_TAG" --sha "$GITHUB_SHA"

  build:
    needs: prepare
    name: Notarize macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Check signing secrets
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os
          names = ('MACOS_CERTIFICATE_BASE64', 'MACOS_CERTIFICATE_PASSWORD',
                   'APPLE_ID', 'APPLE_APP_SPECIFIC_PASSWORD', 'APPLE_TEAM_ID')
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing Actions Secrets: ' + ', '.join(missing))
          PY

      - name: Verify runner and build tools
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          cmake --version
          ninja --version
          xcrun clang --version
          xcrun notarytool --version

      - name: Fetch pinned dependencies
        run: bash tools/fetch_macos_deps.sh

      - name: Configure Release build
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          cmake -S . -B build/macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="$TARGET_ARCH" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DMXV2_CAST=OFF \
            -DBUILD_TESTING=ON \
            -DPython3_EXECUTABLE="$(command -v python3)"

      - name: Build and test
        run: |
          cmake --build build/macos --parallel 3
          ctest --test-dir build/macos --output-on-failure --no-tests=error

      - name: Install app
        run: |
          cmake --install build/macos --prefix dist
          plutil -lint dist/mxv2.app/Contents/Info.plist
          cmake -DMXV2_MACOS_LICENSE_VERIFY_ONLY=ON \
            -DMXV2_MACOS_LICENSE_OUTPUT=dist/mxv2.app/Contents/Resources/LICENSE \
            -P cmake/macos_license.cmake

      - name: Sign, notarize, staple and verify
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash tools/notarize_macos.sh dist/mxv2.app "$TARGET_ARCH" dist

      - name: Upload notarization diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: notarization-diagnostics-${{ matrix.arch }}
          path: dist/notary-*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload notarized app
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mxv2-macos-notarized-${{ matrix.arch }}
          path: |
            dist/mxv2-macos-${{ matrix.arch }}-notarized.zip
            dist/mxv2-macos-${{ matrix.arch }}-notarized.zip.sha256
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout selected commit and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download both notarized packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: mxv2-macos-notarized-*
          path: release-assets
          merge-multiple: true

      - name: Create or update Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 tools/macos_draft_release.py \
            --tag "$RELEASE_TAG" --sha "$GITHUB_SHA" --assets release-assets
